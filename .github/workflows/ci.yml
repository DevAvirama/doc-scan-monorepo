name: Monorepo CI Pipeline

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-backend:
    name: Backend Linting (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run Ruff Linting
        run: uvx ruff check apps/

      - name: Run Ruff Format Check
        run: uvx ruff format --check apps/

  lint-and-build-web:
    name: Web Frontend (Lint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"

  test-cv-service:
    name: Tests - CV Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cv_service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install Dependencies
        run: uv sync --all-groups

      - name: Run Pytest
        env:
          GEMINI_API_KEY: "ci-mock-key"
          GEMINI_MODEL: "gemini-3.8-flash"
          ENVIRONMENT: "testing"
        run: uv run pytest -v

  test-core-api:
    name: Tests - Core API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/core_api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install Dependencies
        run: uv sync --all-groups

      - name: Run Pytest
        env:
          ENVIRONMENT: "testing"
        run: uv run pytest -v

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-and-build-web, test-cv-service, test-core-api]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build cv_service Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/cv_service
          file: ./apps/cv_service/Dockerfile
          push: false
          tags: docscan-cv-service:ci

      - name: Build core_api Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/core_api
          file: ./apps/core_api/Dockerfile
          push: false
          tags: docscan-core-api:ci

      - name: Build web Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: false
          tags: docscan-web:ci
