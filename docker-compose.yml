services:
  cv_service:
    build:
      context: ./apps/cv_service
      dockerfile: Dockerfile
    container_name: docscan_cv_service
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(\"http://localhost:8001/api/v1/health\")"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  core_api:
    build:
      context: ./apps/core_api
      dockerfile: Dockerfile
    container_name: docscan_core_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CV_SERVICE_URL=http://cv_service:8001/api/v1
    depends_on:
      cv_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/v1/health\")"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: docscan_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      core_api:
        condition: service_healthy
